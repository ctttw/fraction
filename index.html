    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>中投區高中職錄取分數查詢平台</title>
    <!-- Keep Tailwind CDN for simplicity without extra config files -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --glass-border: rgba(255, 255, 255, 0.5);
        --glass-bg: rgba(255, 255, 255, 0.65);
        --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
      }

      body {
        font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
        background-color: #f8fafc;
        color: #1e293b;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      
      /* Dynamic Background */
      .bg-gradient-animate {
        background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
      }

      /* Subtle Grid */
      .bg-grid-pattern {
        background-size: 40px 40px;
        background-image: radial-gradient(circle, #cbd5e1 1px, transparent 1px);
        mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
        -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #94a3b8; 
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b; 
      }

      /* Animations */
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }

      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }

      .animate-float {
        animation: float 6s ease-in-out infinite;
      }

      .animate-fade-in-up {
        animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0; /* Start hidden */
      }
      
      /* Utilities */
      .glass-card {
        background: var(--glass-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
        box-shadow: var(--glass-shadow);
      }
      
      .glass-panel {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
      }
      
      .text-gradient {
        background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .skeleton-shimmer {
        position: relative;
        overflow: hidden;
        background: #f1f5f9;
      }
      .skeleton-shimmer::after {
        content: '';
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
        background-image: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0) 0,
          rgba(255, 255, 255, 0.5) 20%,
          rgba(255, 255, 255, 0.8) 60%,
          rgba(255, 255, 255, 0)
        );
        animation: shimmer 1.5s infinite;
      }
      
      /* Hide scrollbar for horizonal scroll areas */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>

     <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] bg-blue-200/20 rounded-full blur-[100px] animate-float" style="animation-duration: 15s;"></div>
        <div class="absolute top-[20%] right-[-10%] w-[40vw] h-[40vw] bg-purple-200/20 rounded-full blur-[100px] animate-float" style="animation-delay: -5s; animation-duration: 20s;"></div>
        <div class="absolute bottom-[-10%] left-[20%] w-[35vw] h-[35vw] bg-indigo-200/20 rounded-full blur-[100px] animate-float" style="animation-delay: -10s; animation-duration: 18s;"></div>
        <div class="absolute inset-0 bg-grid-pattern opacity-[0.4]"></div>
     </div>
